version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: repolens_db
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repolens_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: repolens_cache
    ports:
      - "6379:6379"

volumes:
  pgdata:
